name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Until the backend and frontend skeletons exist, CI only reports that and stays green.
      - id: detect
        run: |
          if [ -f backend/go.mod ] && [ -f frontend/package-lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::backend/go.mod or frontend/package-lock.json missing - skipping checks"; fi
      - if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: steps.detect.outputs.ready == 'true'
        uses: golangci/golangci-lint-action@v8
        with: { version: latest, install-only: true } # make lint runs it with backend/.golangci.yml
      - if: steps.detect.outputs.ready == 'true'
        run: npm ci
        working-directory: frontend
      - if: steps.detect.outputs.ready == 'true'
        run: make lint test cover-check
      - uses: actions/upload-artifact@v5
        if: always() && steps.detect.outputs.ready == 'true'
        with: { name: coverage, path: coverage/ }
